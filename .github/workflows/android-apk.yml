name: Gerar aplicativo Android BelaMira
on:
  push:
    branches: [main]
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  android:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Gerar APK de teste assinado
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Disponibilizar instalador Android
        uses: actions/upload-artifact@v4
        with:
          name: BelaMira-Moda-Circular-Android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
